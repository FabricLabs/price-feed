name: npm test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Git deps (e.g. Fabric packages) run nested npm install; Puppeteer must not download Chrome in CI.
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rollup browser bundle (build:assets)
        run: npm run build:assets

      - name: Unit tests (mocha)
        run: npm test
